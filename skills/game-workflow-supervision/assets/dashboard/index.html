<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>프로젝트 개발 현황</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar"><span class="logo" aria-hidden="true">◈</span><strong>프로젝트 개발 현황</strong><span class="quiet">이 프로젝트의 작업 기록</span></header>
  <main>
    <div class="heading"><div><p class="quiet">프로젝트 대시보드</p><h1 id="project-name">기록을 불러오는 중</h1></div><button id="refresh" type="button">기록 다시 읽기</button></div>
    <div id="connection" role="status" aria-live="polite">연결 중입니다.</div>
    <nav aria-label="개발 현황 메뉴">
      <button type="button" data-tab="overview" aria-pressed="true">개요</button>
      <button type="button" data-tab="flow" aria-pressed="false">작업 흐름</button>
      <button type="button" data-tab="skills" aria-pressed="false">사용 스킬</button>
      <button type="button" data-tab="issues" aria-pressed="false">발견된 문제</button>
      <button type="button" data-tab="scope" aria-pressed="false">개발 범위</button>
    </nav>
    <section id="content" aria-label="현황 내용"></section>
    <footer id="footer">작업 기록을 읽은 시각과 실제 작업자의 활동은 다릅니다.</footer>
  </main>
  <dialog id="evidence"><div class="dialog-head"><h2 id="evidence-title">작업 기록 원문</h2><button id="close-evidence" type="button">닫기</button></div><p id="evidence-path" class="quiet"></p><pre id="evidence-text"></pre></dialog>
</body>
</html>
